<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ehiala'S Bar - Sistema de Vendas</title>
    <!-- Tailwind CSS para um design limpo e responsivo -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="bg-amber-600 text-white p-4 shadow-md sticky top-0 z-50 flex justify-between items-center">
        <div>
            <h1 class="text-xl font-bold tracking-wide">Ehiala’S Bar</h1>
            <p class="text-xs text-amber-100">Gestão de Vendas & Pagamentos</p>
        </div>
        <span id="cart-badge" class="bg-slate-900 text-amber-400 font-bold px-3 py-1 rounded-full text-sm">0 MT</span>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-1 p-4 max-w-md mx-auto w-full pb-24">
        
        <!-- Configuração do Número de Recebimento -->
        <section class="bg-slate-800 p-3 rounded-xl shadow-lg mb-4 border border-slate-700">
            <label for="merchant-phone" class="block text-xs font-semibold text-amber-400 mb-1">📱 Conta para Receber (M-Pesa / e-Mola)</label>
            <input type="text" id="merchant-phone" value="877800500 - Marques Gabriel Ehiala" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
        </section>

        <!-- Secção de Produtos -->
        <section class="mb-6">
            <h2 class="text-lg font-semibold mb-3 text-amber-400 border-b border-amber-600/30 pb-1">Bebidas & Artigos</h2>
            <div id="product-list" class="grid grid-cols-2 gap-3">
                <!-- Os produtos serão injetados via JavaScript -->
            </div>
        </section>

        <!-- Resumo do Pedido -->
        <section class="bg-slate-800 p-4 rounded-xl shadow-lg mb-6 border border-slate-700">
            <h2 class="text-md font-semibold mb-2 text-slate-200">Resumo do Pedido</h2>
            <div id="cart-items" class="text-sm text-slate-400 mb-3 divide-y divide-slate-700">
                <p class="py-2 italic">O carrinho está vazio.</p>
            </div>
            
            <!-- Campo Nome do Cliente -->
            <div class="mb-3 pt-3 border-t border-slate-700">
                <label for="customer-name" class="block text-xs font-medium text-slate-300 mb-1">Nome do Cliente (Opcional)</label>
                <input type="text" id="customer-name" placeholder="Ex: Convidado" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-amber-500">
            </div>

            <div class="flex justify-between items-center font-bold text-lg pt-2 border-t border-slate-700">
                <span>Total:</span>
                <span id="cart-total" class="text-amber-400">0 MT</span>
            </div>
        </section>

        <!-- Método de Pagamento -->
        <section class="bg-slate-800 p-4 rounded-xl shadow-lg mb-6 border border-slate-700">
            <h2 class="text-md font-semibold mb-2 text-slate-200">Método de Pagamento</h2>
            <p id="payment-instruction" class="text-xs text-slate-400 mb-3">Selecione como o cliente vai pagar.</p>
            <div class="grid grid-cols-3 gap-2">
                <button onclick="setPayment('M-Pesa')" id="btn-mpesa" class="pay-btn p-2 text-xs font-semibold rounded-lg bg-slate-700 border border-slate-600 hover:bg-amber-600 transition">M-Pesa</button>
                <button onclick="setPayment('e-Mola')" id="btn-emola" class="pay-btn p-2 text-xs font-semibold rounded-lg bg-amber-600 border border-amber-500 transition">e-Mola</button>
                <button onclick="setPayment('Dinheiro')" id="btn-dinheiro" class="pay-btn p-2 text-xs font-semibold rounded-lg bg-slate-700 border border-slate-600 hover:bg-amber-600 transition">Dinheiro</button>
            </div>
        </section>

        <!-- Botão de Finalizar Venda -->
        <button onclick="checkout()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-base">
            Concluir Venda & Emitir Recibo
        </button>
    </main>

    <!-- Modal de Recibo -->
    <div id="receipt-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="bg-slate-800 rounded-2xl p-6 max-w-sm w-full border border-slate-700 shadow-2xl">
            <h3 class="text-lg font-bold text-amber-400 text-center mb-1">Ehiala’S Bar - Recibo</h3>
            <p id="receipt-date" class="text-xs text-slate-400 text-center mb-3"></p>
            
            <div class="bg-slate-900/60 p-2.5 rounded-lg mb-3 text-xs border border-slate-700/50 space-y-1">
                <div><span class="text-slate-400">Cliente:</span> <span id="receipt-customer" class="font-semibold text-slate-200"></span></div>
                <div id="receipt-receiver-box"><span class="text-slate-400">Destino:</span> <span id="receipt-receiver" class="font-semibold text-amber-400"></span></div>
            </div>

            <div id="receipt-body" class="text-sm text-slate-300 mb-4 space-y-1 border-y border-slate-700 py-3">
                <!-- Detalhes do recibo -->
            </div>

            <div class="flex justify-between font-bold text-base mb-6">
                <span>Total Pago:</span>
                <span id="receipt-total" class="text-amber-400">0 MT</span>
            </div>

            <button onclick="closeReceipt()" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-semibold py-2.5 rounded-xl transition">
                Novo Atendimento
            </button>
        </div>
    </div>

    <!-- Lógica JavaScript -->
    <script>
        const products = [
            { id: 1, name: 'Laurentina', price: 100 },
            { id: 2, name: 'Manica', price: 90 },
            { id: 3, name: 'Savanna', price: 120 },
            { id: 4, name: 'Amarula', price: 150 },
            { id: 5, name: 'Água / Refresco', price: 50 }
        ];

        let cart = [];
        let selectedPayment = 'e-Mola'; // Definido e-Mola por predefinição com o seu número

        function init() {
            const listEl = document.getElementById('product-list');
            listEl.innerHTML = products.map(p => `
                <button onclick="addToCart(${p.id})" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 p-3 rounded-xl text-left flex flex-col justify-between transition active:scale-95">
                    <span class="font-medium text-slate-200">${p.name}</span>
                    <span class="text-amber-400 font-bold mt-2">${p.price} MT</span>
                </button>
            `).join('');
            updateCartUI();
            updatePaymentInstruction();
        }

        function addToCart(productId) {
            const prod = products.find(p => p.id === productId);
            const item = cart.find(i => i.id === productId);
            if (item) {
                item.qty++;
            } else {
                cart.push({ ...prod, qty: 1 });
            }
            updateCartUI();
        }

        function removeFromCart(productId) {
            cart = cart.filter(i => i.id !== productId);
            updateCartUI();
        }

        function updateCartUI() {
            const itemsEl = document.getElementById('cart-items');
            const totalEl = document.getElementById('cart-total');
            const badgeEl = document.getElementById('cart-badge');

            if (cart.length === 0) {
                itemsEl.innerHTML = '<p class="py-2 italic text-slate-500">O carrinho está vazio.</p>';
                totalEl.textContent = '0 MT';
                badgeEl.textContent = '0 MT';
                return;
            }

            let total = 0;
            itemsEl.innerHTML = cart.map(i => {
                let subtotal = i.price * i.qty;
                total += subtotal;
                return `
                    <div class="py-2 flex justify-between items-center">
                        <div>
                            <span class="font-medium text-slate-200">${i.name}</span>
                            <span class="text-xs text-slate-400 block">${i.qty}x ${i.price} MT</span>
                        </div>
                        <div class="flex items-center gap-3">
                            <span class="font-semibold">${subtotal} MT</span>
                            <button onclick="removeFromCart(${i.id})" class="text-red-400 hover:text-red-300 text-xs px-1.5 py-0.5 rounded bg-red-950/40">✕</button>
                        </div>
                    </div>
                `;
            }).join('');

            totalEl.textContent = `${total} MT`;
            badgeEl.textContent = `${total} MT`;
        }

        function setPayment(method) {
            selectedPayment = method;
            document.querySelectorAll('.pay-btn').forEach(btn => {
                btn.classList.remove('bg-amber-600', 'border-amber-500');
                btn.classList.add('bg-slate-700', 'border-slate-600');
            });
            const activeBtn = document.getElementById(`btn-${method.toLowerCase().replace('-', '')}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-slate-700', 'border-slate-600');
                activeBtn.classList.add('bg-amber-600', 'border-amber-500');
            }
            updatePaymentInstruction();
        }

        function updatePaymentInstruction() {
            const instructionEl = document.getElementById('payment-instruction');
            const accountInfo = document.getElementById('merchant-phone').value.trim();
            if (selectedPayment === 'Dinheiro') {
                instructionEl.textContent = 'Pagamento em espécie (Dinheiro físico).';
            } else {
                instructionEl.innerHTML = `Instrua o cliente a enviar para: <span class="text-amber-400 font-bold">${accountInfo}</span> via <span class="font-semibold text-slate-200">${selectedPayment}</span>`;
            }
        }

        document.getElementById('merchant-phone').addEventListener('input', updatePaymentInstruction);

        function checkout() {
            if (cart.length === 0) {
                alert('Adicione pelo menos um item ao carrinho antes de concluir a venda.');
                return;
            }

            let customerName = document.getElementById('customer-name').value.trim();
            if (!customerName) {
                customerName = 'Cliente Geral';
            }

            let accountInfo = document.getElementById('merchant-phone').value.trim();
            let total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            
            document.getElementById('receipt-date').textContent = new Date().toLocaleString('pt-MZ');
            document.getElementById('receipt-customer').textContent = customerName;
            
            const receiverBox = document.getElementById('receipt-receiver-box');
            if (selectedPayment !== 'Dinheiro') {
                receiverBox.style.display = 'block';
                document.getElementById('receipt-receiver').textContent = `${selectedPayment}: ${accountInfo}`;
            } else {
                receiverBox.style.display = 'none';
            }

            document.getElementById('receipt-body').innerHTML = `
                ${cart.map(i => `<div class="flex justify-between"><span>${i.qty}x ${i.name}</span><span>${i.qty * i.price} MT</span></div>`).join('')}
                <div class="pt-2 mt-2 border-t border-slate-700 text-xs text-slate-400 flex justify-between">
                    <span>Método:</span>
                    <span class="font-semibold text-slate-200">${selectedPayment}</span>
                </div>
            `;
            document.getElementById('receipt-total').textContent = `${total} MT`;
            document.getElementById('receipt-modal').classList.remove('hidden');
            document.getElementById('receipt-modal').classList.add('flex');
        }

        function closeReceipt() {
            cart = [];
            document.getElementById('customer-name').value = '';
            updateCartUI();
            document.getElementById('receipt-modal').classList.remove('flex');
            document.getElementById('receipt-modal').classList.add('hidden');
        }

        init();
    </script>
</body>
</html>
