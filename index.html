<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ehiala’S Deck · Menu & Pagamento Automático</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50 px-4 py-4 text-center">
        <h1 class="text-xl font-bold tracking-wider text-amber-500">EHIALA’S DECK</h1>
        <p class="text-xs text-zinc-400">Muiane · O teu espaço de eleição</p>
    </header>

    <main class="max-w-md mx-auto p-4 space-y-6">
        
        <!-- Secção do Menu -->
        <section>
            <h2 class="text-lg font-semibold mb-3 border-l-4 border-amber-500 pl-2">Bebidas & Petiscos</h2>
            <div id="product-list" class="space-y-3">
                <!-- Os produtos serão injetados aqui via JavaScript -->
            </div>
        </section>

        <!-- Carrinho de Compras / Checkout -->
        <section class="bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-4">
            <h2 class="text-lg font-semibold text-amber-400">O Teu Pedido</h2>
            <div id="cart-items" class="text-sm text-zinc-300 divide-y divide-zinc-800">
                <p class="text-zinc-500 py-2">O carrinho está vazio.</p>
            </div>
            
            <div class="flex justify-between font-bold text-base border-t border-zinc-800 pt-3">
                <span>Total:</span>
                <span id="cart-total" class="text-amber-400">0 MT</span>
            </div>

            <!-- Dados de Pagamento Automático (USSD Push) -->
            <div class="space-y-3 pt-2 border-t border-zinc-800">
                <label class="block text-xs font-medium text-zinc-400">Número de Telemóvel (e-Mola / M-Pesa):</label>
                <input type="tel" id="client-phone" placeholder="Ex: 877800500" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-3 text-sm text-zinc-100 focus:outline-none focus:border-amber-500">
                
                <button onclick="triggerAutomaticPayment()" class="w-full bg-amber-600 hover:bg-amber-500 text-zinc-950 font-bold py-3 rounded-lg transition-all shadow-lg text-sm uppercase tracking-wide">
                    Pagar Automaticamente (Pedir PIN)
                </button>
            </div>
        </section>

    </main>

    <script>
        // Base de dados de produtos com os preços reais fornecidos
        const products = [
            { id: 1, name: "Cerveja 2M", price: 70, category: "Cervejas" },
            { id: 2, name: "Cerveja Manica", price: 75, category: "Cervejas" },
            { id: 3, name: "Cerveja Laurentina", price: 80, category: "Cervejas" },
            { id: 4, name: "Cerveja Zavana", price: 100, category: "Cervejas" },
            { id: 5, name: "Cerveja Impala", price: 55, category: "Cervejas" },
            { id: 6, name: "Cerveja Lite", price: 80, category: "Cervejas" },
            { id: 7, name: "Super Check", price: 75, category: "Cervejas" },
            { id: 8, name: "Energético Red Bull", price: 100, category: "Não Alcoólicos" },
            { id: 9, name: "Coca-Cola (Lata/Garrafa)", price: 70, category: "Não Alcoólicos" },
            { id: 10, name: "Sumo Santal / Minute", price: 70, category: "Não Alcoólicos" },
            { id: 11, name: "Água / WINI", price: 50, category: "Não Alcoólicos" },
            { id: 12, name: "Sardinha (Petisco)", price: 100, category: "Petiscos" },
            { id: 13, name: "Bolacha de Côco / Água e Sal", price: 25, category: "Petiscos" }
        ];

        let cart = [];

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map(p => `
                <div class="flex justify-between items-center bg-zinc-900 border border-zinc-800/60 p-3 rounded-xl">
                    <div>
                        <h3 class="font-medium text-sm">${p.name}</h3>
                        <p class="text-xs text-amber-500">${p.price} MT</p>
                    </div>
                    <button onclick="addToCart(${p.id})" class="bg-zinc-800 hover:bg-amber-600 hover:text-zinc-950 px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors">
                        + Adicionar
                    </button>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartContainer = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');
            
            if (cart.length === 0) {
                cartContainer.innerHTML = `<p class="text-zinc-500 py-2">O carrinho está vazio.</p>`;
                totalContainer.innerText = "0 MT";
                return;
            }

            let total = 0;
            cartContainer.innerHTML = cart.map(item => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                return `
                    <div class="flex justify-between py-2 text-xs">
                        <span>${item.qty}x ${item.name}</span>
                        <span class="text-zinc-300">${subtotal} MT</span>
                    </div>
                `;
            }).join('');
            
            totalContainer.innerText = total + " MT";
        }

        function triggerAutomaticPayment() {
            const phone = document.getElementById('client-phone').value.trim();
            if (cart.length === 0) {
                alert("Por favor, adicione itens ao carrinho primeiro.");
                return;
            }
            if (!phone || phone.length < 9) {
                alert("Por favor, introduza um número de telemóvel válido para o pagamento (ex: 877800500).");
                return;
            }

            // Simulação / Acionamento do USSD Push (Gateway de Pagamento / e-Mola / M-Pesa)
            alert(`A enviar pedido de pagamento automático para o número ${phone}...\n\nO cliente receberá um pop-up no telemóvel para introduzir o PIN e autorizar a transação para o recebedor oficial (877800500).`);
            
            // Redirecionamento opcional para WhatsApp com os detalhes confirmados
            let total = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            let message = `*PEDIDO PAGO VIA APP* %0A- Telemóvel: ${phone} %0A- Total: ${total} MT`;
            window.open(`https://wa.me/258877800500?text=${message}`, '_blank');
        }

        renderProducts();
    </script>
</body>
</html>
